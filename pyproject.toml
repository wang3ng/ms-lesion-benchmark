[project]
name = "msbench"
version = "0.1.0"
description = "Benchmark of nnU-Net against MedSAM for multiple sclerosis lesion segmentation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "nibabel>=5.2",
    "PyYAML>=6.0",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-image>=0.22",
    "connected-components-3d>=3.12",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
    "nnunetv2>=2.5",
    "monai>=1.3",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
