# Protocol captured as config. Scripts read this file instead of hard-coding
# values. Design follows the submitted full proposal; see CLAUDE.md.

project: msbench
seed: 20261011

# Relative paths are resolved against the repository root. Data and nnU-Net
# folders live outside git (CV_MS_proj/data, CV_MS_proj/nnunet).
paths:
  data_raw: ../data/raw
  data_processed: ../data/processed
  nnunet_root: ../nnunet         # nnUNet_raw / nnUNet_preprocessed / nnUNet_results
  logs: logs
  medsam_checkpoint: ../models/medsam/medsam_vit_b.pth   # official MedSAM ViT-B (bowang-lab, 2023-08)
  medsam_cache: ../cache/medsam_embeddings              # frozen-encoder embeddings, one .npy per case
  medsam_runs: ../medsam_runs                           # fine-tuned decoders + predictions
  # E8 zoomed-tile embeddings, MSSEG training cases only (~94 GB). Machine-specific: NVMe system disk of
  # the lab RTX 4090 box (the data HDD is too slow for random reads), mode 700. DELETE after the project
  # (TODO.md). Test-set tile embeddings are never cached (computed on the fly).
  medsam_e8_cache: /home/kirby/msbench_e8_cache
  # E7 (exploratory, after the results freeze): MS-SAM-LESS runs and verified pretrained weights
  e7_runs: ../e7_runs
  sam_vit_b: ../models/e7_downloads/sam_vit_b_01ec64.pth        # Meta SAM ViT-B; md5 01ec64d2..., sha256 ec2df627...
  hardnet85: ../models/e7_downloads/hardnet85-a28faa00.pth      # HarDNet-85 ImageNet (ping-chao.com); sha256 a28faa00...

primary_dataset: msseg2016
development_dataset: mslesseg   # for debugging pipelines only; not in final tables
transfer_dataset: isbi2015

# Shared by MSSEG, ISBI and MSLesSeg, so one model can be tested on all.
channels: [flair, t1, t2]

models:
  nnunet:
    framework: nnunetv2
    dataset_id: 501             # Dataset501_MSSEG2016; 777 is taken on the lab machine
    dataset_name: MSSEG2016
    configuration: 3d_fullres   # final numbers on the lab RTX 4090
    folds: 5
    epochs: 1000                # if reduced, reduce for ALL folds and record it
  medsam:
    checkpoint: medsam_vit_b
    input: axial_slices         # channels = flair, t1, t2 (each clipped to 0.5-99.5 pct in brain, [0, 1])
    slice_geometry: keep_aspect_pad_1024   # physical aspect kept, zero-padded to 1024 x 1024
    slices: brain                # slices with any brain-mask voxel (ISBI: FLAIR != 0)
    freeze_image_encoder: true  # train prompt encoder + mask decoder only
    cache_embeddings: true
    embedding_dtype: float16
    reconstruction: stack_axial_slices
    # Fine-tuning (scripts/train_medsam.py), identical for every box condition and
    # fold; fixed 2026-11-17 before any MedSAM training. Folds = E1's
    # experiments/E1/splits_final.json. No early stopping: the last step is used.
    finetune:
      trainable: [prompt_encoder, mask_decoder]
      batch_size: 16
      steps: 10000              # decided 2026-11-17 before any MedSAM training (benchmark 0.04 s/step);
                                # same for E2a, E2b, E2c and E8, every fold
      lr: 1.0e-4
      weight_decay: 0.01
      warmup_steps: 200
      loss: dice_plus_bce        # as MedSAM: monai DiceLoss(sigmoid, squared_pred) + BCE, 1024 x 1024
      # dice_on: which boxes get the per-box Dice term; BCE is always on every box.
      # POST-HOC CORRECTION 2026-11-19: the first E2c run used Dice on all boxes
      # (all_boxes) and collapsed on the training folds (constant empty output,
      # loss plateau ~0.5; experiments/E2/README.md). Changed to lesion_boxes after
      # that run, from training-fold behaviour only; no test data involved. Same
      # loss for E2a, E2b, E2c and E8. E2a is unaffected (every E2a box contains
      # lesion voxels, so both settings give the identical loss; not rerun).
      dice_on: lesion_boxes
      target: reference_inside_box   # target = consensus mask restricted to the box
      # Training-data-only collapse check (added 2026-11-19 with the correction).
      # Windows of `window` steps: start = steps 1..window, check = the `window`
      # steps ending at `at_step`, then again every `repeat_every` steps and at
      # the last step. The fold is stopped (no prediction, collapse_check.json,
      # exit code 3) if the lesion-box loss has not fallen to
      # <= max_lesion_loss_ratio x its start value, or if fewer than
      # min_lesion_nonempty of the lesion boxes get a non-empty prediction (any
      # logit > 0 inside the box), i.e. almost all predictions empty. For E2c both
      # criteria are also applied to the brain box and the tiles separately (kinds
      # with >= min_boxes_per_kind lesion boxes per window). Repeat + per-kind
      # added before the rerun: a 3,000-step replay of the first-run loss on fold 1
      # (training patients) passed a single pooled check at step 3,000 (ratio 0.68,
      # non-empty 0.58), but by step 10,000 only 5% of lesion tiles were non-empty
      # while the brain box over-segmented.
      collapse_check:
        at_step: 3000
        repeat_every: 1000
        window: 100
        max_lesion_loss_ratio: 0.8
        min_lesion_nonempty: 0.10
        min_boxes_per_kind: 30
      positive_fraction: 0.5     # E2c/E2b: share of boxes with lesion voxels per batch (rest: empty boxes)
      mixed_precision: bf16
    inference:
      combine: mean_prob_over_covering_boxes   # per pixel: mean sigmoid over the boxes that cover it
      threshold: 0.5
      batch_size: 64

# E7 — EXPLORATORY, added after the results freeze (branch e7-ms-sam-less). MS-SAM-LESS
# (Proietto Salanitri et al., Pattern Recognit. Lett. 2026; github.com/perceivelab/MS-SAM-LESS @ dde835c)
# and its HarDNet Segmentor baseline, trained on E1's 5 folds and scored with our scripts. Published
# hyperparameters (README commands) except the deviations listed, approved 2026-11-20.
e7:
  upstream_commit: dde835c95aa2978030830515cace8479bc0a8eac
  common: {optim: SGD, lr: 0.01, momentum: 0.0, weight_decay: 1.0e-4, batch_size: 8, acc_steps: 2,
           criterion: dice_ce, out_channels: 2, hardnet_order: 85, threshold: 0.5, amp: true, seed: 42,
           axcodes: RAS, num_slices: 1}
  phase1: {epochs: 200, sam: sam_vit_b, image_dim: 1024, prompt_learner_input: 512, pos_rand_crop: 0.85, neg_rand_crop: 0.15}
  phase2: {epochs: 100, image_dim: 512, segmentor: ConvUpsample, finetune_backbone: true, init: phase1_last,
           pos_rand_crop: 0.75, neg_rand_crop: 0.25}          # their phase-2 command uses the defaults
  hardnet_baseline: {epochs: 300, image_dim: 512, segmentor: ConvUpsample, finetune_backbone: true, init: imagenet,
                     pos_rand_crop: 0.75, neg_rand_crop: 0.25}
  deviations:
    inputs: "FLAIR/T1/T2 stacked as 3 channels, each z-scored and scaled to [0,1] (paper: FLAIR only); SAM and HarDNet keep their 3-channel first layers"
    repeats_per_epoch: 8              # each training scan 8x per epoch (12 scans/fold -> 12 updates/epoch; ~2,400 phase-1 updates), to roughly match their MSLesSeg setup
    checkpoint: last_epoch            # no selection on validation patients (paper: best validation IoU), as E1/E2
    per_epoch_validation: none
    hardnet_baseline_epochs: "phase1 + phase2 = 300 epochs at x8, so the comparison isolates SAM's guidance, not training length"
    inference_resampling: "1 mm isotropic at inference too (their training resamples to 1 mm, their inference does not), mapped back to the case grid"
    test_sets: "5-fold mean-probability ensemble (paper: single model)"
    cache_rate: 1.0                   # all training scans cached in RAM (their default 0.7); speed only
    logging: "wandb/TensorBoard replaced by no-op stand-ins; slice-image logging off"
    environment: "Python 3.12, torch 2.11, MONAI 1.6.1 (paper: Python 3.8, torch 1.13, MONAI 1.3)"

# Exploratory analyses decided after results were seen; reported separately and labelled as such.
analysis:
  iou_filter:
    label: "post-hoc, decided after seeing E2c results"
    models: [E2c, E8]
    rule: drop_masks_below_threshold     # a box whose MedSAM predicted-IoU < t gets an empty mask (still counts in coverage)
    grid: [0.0, 1.0, 0.025]              # thresholds t (start, stop, step) + "no filter"
    selection: nested_cv                 # per outer fold: inner CV over its 12 training patients only
    inner_folds: 4                       # 3 patients each, one per scanner where possible; inner models = same recipe
    criterion: mean_patient_lesion_f1    # on the inner held-out predictions; ties -> lowest threshold
    test_sets: not_applied               # CV only

# Each MedSAM condition is fine-tuned separately, with the same box type
# at training and test time.
experiments:
  E1:  {model: nnunet}
  E2a: {model: medsam, boxes: oracle}         # upper bound on tracing only
  E2b: {model: medsam, boxes: nnunet}         # needs E1 predictions
  E2c: {model: medsam, boxes: independent}    # the fair head-to-head with E1
  E6:  {analysis: biomarkers, models: [E1, best_medsam]}
  E8:                                         # zoomed_tiles OR small_lesion_loss
    fix: choose_after_E2a_vs_E2c
    selected: zoomed_tiles                    # rule applied 2026-11-19 to the CV recalls (0.6692 - 0.1504 = 0.5188 >= 0.15)
    boxes: zoomed                             # = E2c with its tiles zoomed (msbench.medsam.zoom):
    zoomed_tiles:
      tiles: same_as_boxes.independent        # same 4 x 4 grid, 25% overlap, inside the brain bounding box
      tiles_without_brain: skipped            # cannot hold lesions; never cached or predicted
      crop_to_canvas: keep_aspect_pad_1024    # each tile crop re-embedded alone: longer side -> 1024 px (~4x zoom)
      prompt: whole_crop
      brain_box: slice_embedding              # E2c's whole-brain box, unchanged
      embeddings: {msseg_train: cached (paths.medsam_e8_cache), test_sets: on_the_fly}
    # Decision rule, fixed 2026-11-17 BEFORE any MedSAM training. Inputs:
    # pooled lesion-level recall in the <20 mm^3 bin (detected / reference
    # lesions summed over patients, Anima-port rule, MSSEG consensus), from the
    # 5-fold cross-validation predictions on the 15 MSSEG training patients.
    # Never computed on any test set. Rules are checked in order.
    decision_rule:
      metric: pooled_recall_lt20_cv
      rules:
        - if: "recall(E2a) - recall(E2c) >= 0.15"
          then: zoomed_tiles              # MedSAM can trace small lesions but does not find them
        - if: "recall(E2a) < 0.6"
          then: small_lesion_loss         # even with oracle boxes small lesions are traced poorly
        - else: zoomed_tiles

boxes:
  independent:
    whole_brain: true           # one box around the brain mask per slice
    tiles:
      grid: [4, 4]              # within the brain bounding box
      overlap: 0.25
      include_empty_tiles: true # so MedSAM learns to output an empty mask
  oracle:
    jitter_px: [0, 5]           # each side pushed out by U{0..5} voxels (train: new draw per sample; test: seeded)
    components: 2d_8_connected  # one box per lesion component in each axial slice
  nnunet:                       # E2b: same as oracle but from E1 predictions (OOF for training patients)
    jitter_px: [0, 5]
    components: 2d_8_connected

metrics:
  voxel_dice: {empty_both: 1.0}
  lesion_detection:
    # Port of animaSegPerfAnalyzer 4.2 (MSSEG-2016 tool, Commowick et al., Sci Rep
    # 2018); values = its command-line defaults. Verified against the binary on
    # MSSEG training cases (scripts/anima_check.py, 2026-11-17).
    rule: anima_segperf_4.2
    connectivity: 6             # ITK ConnectedComponentImageFilter default (face neighbours)
    min_lesion_mm3: 3.0         # -v; components must be STRICTLY larger, in both masks
    alpha: 0.10                 # -x; min covered fraction (strictly greater)
    beta: 0.70                  # -y; max fraction of an overlapping component outside the other mask
    gamma: 0.65                 # -z; share of the overlap whose components are checked against beta
  # Edges fixed 2026-11-15 from MSSEG TRAINING-set consensus counts only
  # (scripts/lesion_size_bins.py). Counts recomputed 2026-11-17 with the
  # Anima-port rule (6-conn, > 3 mm^3): 557 lesions, <20: 133, 20-100: 252,
  # >=100: 172 (was 541 = 127/243/171 with 26-conn, >= 3 mm^3). Edges unchanged.
  # Do not change after looking at any test result.
  size_bins_mm3: [20, 100]
  report: [dice, lesion_precision, lesion_recall, lesion_f1, size_bin_f1,
           fp_lesions_per_scan, lesion_count, lesion_volume_ml]

statistics:
  cross_validation: {folds: 5, unit: patient}
  paired_test: wilcoxon_signed_rank
  confidence_interval: {method: bootstrap_percentile, level: 0.95, n_boot: 10000}
  agreement: [mae, bland_altman]  # ICC descriptive only

splits:
  msseg2016:
    # Official challenge split: GE Discovery is absent from training.
    train_scanners: [siemens_verio_3t, siemens_aera_1p5t, philips_ingenia_3t]
    unseen_scanner: ge_discovery_3t
    reference: consensus          # the 7 expert masks give the human reference
  isbi2015:
    role: external_test
    use: labeled_training_subjects  # 21 scans; online leaderboard unavailable
    raters: [rater1, rater2]        # score each separately
  mslesseg:
    use_official_split: true

reporting:
  test_settings: [msseg_in_distribution, msseg_ge_unseen, isbi2015]
  stratify_by: [scanner, lesion_size_bin]
  per_case_table: [msseg_ge_unseen]
