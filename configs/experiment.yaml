# Protocol captured as config. Scripts read this file instead of hard-coding
# values. Design follows the submitted full proposal; see CLAUDE.md.

project: msbench
seed: 20261011

# Relative paths are resolved against the repository root. Data and nnU-Net
# folders live outside git (CV_MS_proj/data, CV_MS_proj/nnunet).
paths:
  data_raw: ../data/raw
  data_processed: ../data/processed
  nnunet_root: ../nnunet         # nnUNet_raw / nnUNet_preprocessed / nnUNet_results
  logs: logs

primary_dataset: msseg2016
development_dataset: mslesseg   # for debugging pipelines only; not in final tables
transfer_dataset: isbi2015

# Shared by MSSEG, ISBI and MSLesSeg, so one model can be tested on all.
channels: [flair, t1, t2]

models:
  nnunet:
    framework: nnunetv2
    dataset_id: 501             # Dataset501_MSSEG2016; 777 is taken on the lab machine
    dataset_name: MSSEG2016
    configuration: 3d_fullres   # final numbers on the lab RTX 4090
    folds: 5
    epochs: 1000                # if reduced, reduce for ALL folds and record it
  medsam:
    checkpoint: medsam_vit_b
    input: axial_slices         # channels = flair, t1, t2
    freeze_image_encoder: true  # train prompt encoder + mask decoder only
    cache_embeddings: true
    reconstruction: stack_axial_slices

# Each MedSAM condition is fine-tuned separately, with the same box type
# at training and test time.
experiments:
  E1:  {model: nnunet}
  E2a: {model: medsam, boxes: oracle}         # upper bound on tracing only
  E2b: {model: medsam, boxes: nnunet}         # needs E1 predictions
  E2c: {model: medsam, boxes: independent}    # the fair head-to-head with E1
  E6:  {analysis: biomarkers, models: [E1, best_medsam]}
  E8:  {fix: choose_after_E2a_vs_E2c}         # zoomed_tiles OR small_lesion_loss

boxes:
  independent:
    whole_brain: true           # one box around the brain mask per slice
    tiles:
      grid: [4, 4]              # within the brain bounding box
      overlap: 0.25
      include_empty_tiles: true # so MedSAM learns to output an empty mask
  oracle:
    jitter_px: [0, 5]

metrics:
  voxel_dice: {empty_both: 1.0}
  lesion_detection:
    rule: msseg2016             # Commowick et al., Sci Rep 2018
    connectivity: 26            # VERIFY against animaSegPerfAnalyzer
    min_lesion_mm3: 3.0         # VERIFY against animaSegPerfAnalyzer
    alpha: 0.10                 # min overlap fraction
    gamma: 0.65                 # max fraction of a predicted lesion outside the reference
  # Fixed 2026-11-15 from MSSEG TRAINING-set consensus counts only
  # (scripts/lesion_size_bins.py; 541 lesions, 26-conn, >=3 mm^3):
  # <20: 127, 20-100: 243, >=100: 171. Candidates [10,20,50,100,500] gave
  # 55/72/138/105/134/37. Do not change after looking at any test result.
  size_bins_mm3: [20, 100]
  report: [dice, lesion_precision, lesion_recall, lesion_f1, size_bin_f1,
           fp_lesions_per_scan, lesion_count, lesion_volume_ml]

statistics:
  cross_validation: {folds: 5, unit: patient}
  paired_test: wilcoxon_signed_rank
  confidence_interval: {method: bootstrap_percentile, level: 0.95, n_boot: 10000}
  agreement: [mae, bland_altman]  # ICC descriptive only

splits:
  msseg2016:
    # Official challenge split: GE Discovery is absent from training.
    train_scanners: [siemens_verio_3t, siemens_aera_1p5t, philips_ingenia_3t]
    unseen_scanner: ge_discovery_3t
    reference: consensus          # the 7 expert masks give the human reference
  isbi2015:
    role: external_test
    use: labeled_training_subjects  # 21 scans; online leaderboard unavailable
    raters: [rater1, rater2]        # score each separately
  mslesseg:
    use_official_split: true

reporting:
  test_settings: [msseg_in_distribution, msseg_ge_unseen, isbi2015]
  stratify_by: [scanner, lesion_size_bin]
  per_case_table: [msseg_ge_unseen]
